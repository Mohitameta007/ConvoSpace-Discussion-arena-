<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entering Arena | ConvoSpace</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/transition.css"
    >

</head>


<body>

    <!-- =========================================
         TRANSITION PAGE
    ========================================== -->

    <main class="transition-page">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="transition-header">

            <div class="brand">

                <span class="brand-mark">
                    C
                </span>

                <span class="brand-name">
                    CONVO<span>SPACE</span>
                </span>

            </div>

        </header>


        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <section class="transition-content">


            <div class="transition-label">
                DISCUSSION ARENA
            </div>


            <h1>

                Preparing your
                <em>conversation.</em>

            </h1>


            <p class="transition-description">

                Gathering your players, topic,
                and perspectives.

            </p>


            <!-- =================================
                 LOADING
            ================================== -->

            <div class="arena-loader">

                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- =================================
                 STATUS
            ================================== -->

            <div
                class="transition-status"
                id="transitionStatus"
            >
                Setting the room...
            </div>


            <!-- =================================
                 SUMMARY
            ================================== -->

            <div class="transition-summary">


                <!-- PLAYERS -->

                <div class="summary-item">

                    <span>
                        PLAYERS
                    </span>

                    <strong id="playerCount">
                        —
                    </strong>

                </div>


                <!-- DIVIDER -->

                <div class="summary-divider"></div>


                <!-- TOPIC -->

                <div class="summary-item topic-summary">

                    <span>
                        TOPIC
                    </span>

                    <strong id="topicName">
                        —
                    </strong>

                </div>


            </div>


        </section>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="transition-footer">

            <span>
                CONVOSPACE
            </span>

            <span>
                TALK WITHOUT THE PRESSURE
            </span>

            <span>
                © 2026
            </span>

        </footer>


    </main>


    <script src="../js/pages/transition.js"></script>

</body>

</html>
